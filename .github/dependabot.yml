# SEC-11: keep dependencies and workflow actions patched.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 10
    groups:
      firebase:
        patterns: ['firebase', 'firebase-*', '@firebase/*']
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
