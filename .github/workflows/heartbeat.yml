name: Heartbeat

# Free Supabase projects are paused after a week without "user database activity". This runs
# one tiny database query on each project every 6 hours so that does not happen while they are
# on the Free plan.
#
# It needs NO secrets. It uses only public values (SRS 6.3), set as repository variables
# (GitHub > Settings > Secrets and variables > Actions > Variables):
#   STAGING_SUPABASE_URL, STAGING_SUPABASE_ANON_KEY
#   PROD_SUPABASE_URL,    PROD_SUPABASE_ANON_KEY
# The *_ANON_KEY variables hold the projects' publishable keys (sb_publishable_...). A project
# whose variables are missing is skipped with a warning.
#
# The request calls public.heartbeat() through the REST API as an anonymous visitor: a real,
# read-only query that returns the database clock and touches no table. Only a 2xx answer with
# a timestamp counts as alive. Anything else fails the run, and GitHub emails the repository
# owner: 401/403 (key or grant broken), 404 (function not deployed), 5xx or 000 (paused or
# unreachable). A refused request does not count as activity: the earlier ping read `profiles`,
# got 401 every day, and pos-prod was paused anyway.
#
# Every 6 hours because GitHub starts scheduled runs late (often hours) and can skip one under
# load; four tries a day stay well inside the 7-day window even if several are lost.
#
# It also reminds the developer to make a backup (SYS-04), on the first run of the day only so
# an overdue backup sends one email a day, not four: the run fails, so GitHub emails the
# repository owner, when the last successful MANUAL production backup is more than 7 days
# old. It reads that from the Backup workflow's own run history, not the database, so this
# workflow still needs no secrets: a manual run succeeds only after its last step has added
# the row to public.backup_log. Before go-live (repository variable GO_LIVE not "true") an
# overdue backup is only a warning.
#
# Scheduled workflows only run from the default branch. GitHub also turns schedules off in a
# public repository after 60 days without repository activity, so each run re-enables this
# workflow, which restarts that countdown.
on:
  schedule:
    - cron: '17 3 * * *' # 11:17 in Manila; the first run of the day also checks the backup
    - cron: '17 9,15,21 * * *' # 17:17, 23:17 and 05:17 in Manila
  workflow_dispatch:

permissions:
  contents: read
  actions: write # only to re-enable this workflow (last step)

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Supabase projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping
        env:
          STAGING_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
          PROD_URL: ${{ vars.PROD_SUPABASE_URL }}
          PROD_KEY: ${{ vars.PROD_SUPABASE_ANON_KEY }}
        run: |
          failed=0
          ping() {
            name="$1"; url="${2%/}"; key="$3"
            if [ -z "$url" ] || [ -z "$key" ]; then
              echo "::warning::$name: variables not set, skipped. See the header of heartbeat.yml."
              return
            fi
            out="$RUNNER_TEMP/heartbeat-$name"
            rm -f "$out"
            code=$(curl --silent --output "$out" --max-time 30 --write-out '%{http_code}' \
              -H "apikey: $key" "$url/rest/v1/rpc/heartbeat" || true)
            body=$(head -c 200 "$out" 2>/dev/null || true)
            # Alive only on a 2xx carrying the database clock, e.g. "2026-10-30T03:38:17+00:00".
            if [[ "$code" =~ ^2[0-9][0-9]$ ]] && [[ "$body" =~ ^\"[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
              echo "$name: alive (HTTP $code, database time $body)"
            else
              echo "::error::$name: no healthy answer (HTTP ${code:-000}): $body"
              case "$code" in
                000) echo "::error::$name: no answer at all. Is the project paused?" ;;
                401|403) echo "::error::$name: the key was refused. Check the publishable key in $4." ;;
                404) echo "::error::$name: public.heartbeat() is missing. Are the migrations deployed?" ;;
                5*) echo "::error::$name: the project is down or paused (540 = paused)." ;;
              esac
              failed=1
            fi
          }
          ping staging "$STAGING_URL" "$STAGING_KEY" STAGING_SUPABASE_ANON_KEY
          ping production "$PROD_URL" "$PROD_KEY" PROD_SUPABASE_ANON_KEY
          exit "$failed"

      # SYS-04: the reminder for the developer. "Manual backup (production)" is backup.yml's
      # run-name for a manual production run; only a run from main can reach production.
      # Scheduled, it runs on the first run of the day only; a manual run always checks.
      - name: Last manual backup is recent
        if: always() && (github.event_name != 'schedule' || github.event.schedule == '17 3 * * *')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GO_LIVE: ${{ vars.GO_LIVE }}
        run: |
          overdue() {
            if [ "$GO_LIVE" = true ]; then
              echo "::error::$1 Make a manual production backup (Actions > Backup > Run workflow) and save it offline."
              exit 1
            fi
            echo "::warning::$1 (Only a warning until the repository variable GO_LIVE is true.)"
            exit 0
          }
          if ! runs=$(gh run list --repo "$REPO" --workflow backup.yml --event workflow_dispatch \
            --status success --limit 100 --json displayTitle,createdAt 2>/dev/null); then
            overdue "The Backup workflow is not on the default branch yet."
          fi
          last=$(jq -r 'map(select(.displayTitle == "Manual backup (production)"))
            | (.[0].createdAt // empty)' <<<"$runs")
          [ -n "$last" ] || overdue "There has never been a successful manual production backup."
          days=$(( ($(date -u +%s) - $(date -u -d "$last" +%s)) / 86400 ))
          [ "$days" -lt 7 ] || overdue "The last manual production backup was $days days ago ($last)."
          echo "Last manual production backup: $last ($days days ago)"

      - name: Keep this schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/heartbeat.yml/enable"
