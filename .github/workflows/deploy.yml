name: Deploy

# SRS 7.3:
#   push to dev            -> staging     (pos-staging)
#   tag v* on main         -> production  (pos-prod)
#   pull request into dev  -> staging preview channel (Hosting only)
#
# SEC-10: authentication is Workload Identity Federation only. There is no service account
# key anywhere, and none may ever be added as a secret.
#
# FILL IN (GitHub > Settings > Environments > "staging" and "production" > Variables):
#   GCP_WORKLOAD_IDENTITY_PROVIDER   projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL_ID/providers/PROVIDER_ID
#   GCP_DEPLOY_SERVICE_ACCOUNT       DEPLOYER_NAME@PROJECT_ID.iam.gserviceaccount.com
#   FIREBASE_PROJECT_ID              pos-staging  /  pos-prod
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#   VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID,
#   VITE_RECAPTCHA_ENTERPRISE_SITE_KEY, VITE_STORE_NAME, VITE_STORE_ADDRESS
# These are public web config values, not secrets (SRS 6.3). See README "Deploying".
on:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write # needed to exchange the GitHub token for Google credentials
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Production releases must be tagged on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check required configuration
        env:
          REQUIRED: >-
            ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER && vars.GCP_DEPLOY_SERVICE_ACCOUNT
            && vars.FIREBASE_PROJECT_ID && vars.VITE_FIREBASE_API_KEY
            && vars.VITE_FIREBASE_AUTH_DOMAIN && vars.VITE_FIREBASE_PROJECT_ID
            && vars.VITE_FIREBASE_STORAGE_BUCKET && vars.VITE_FIREBASE_MESSAGING_SENDER_ID
            && vars.VITE_FIREBASE_APP_ID && vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY && 'ok' }}
        run: |
          if [ "$REQUIRED" != "ok" ]; then
            echo "::error::Environment variables are missing. See the header of deploy.yml."
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          VITE_STORE_NAME: ${{ vars.VITE_STORE_NAME }}
          VITE_STORE_ADDRESS: ${{ vars.VITE_STORE_ADDRESS }}

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy Hosting, rules, indexes and Functions
        run: >-
          npx firebase deploy
          --project "${{ vars.FIREBASE_PROJECT_ID }}"
          --only hosting,firestore,storage,functions
          --non-interactive

  preview:
    name: Staging preview channel
    # Pull requests from forks get no credentials.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build -w apps/web
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          VITE_STORE_NAME: ${{ vars.VITE_STORE_NAME }}
          VITE_STORE_ADDRESS: ${{ vars.VITE_STORE_ADDRESS }}

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy preview channel
        run: >-
          npx firebase hosting:channel:deploy "pr-${{ github.event.pull_request.number }}"
          --project "${{ vars.FIREBASE_PROJECT_ID }}"
          --expires 7d
          --non-interactive
